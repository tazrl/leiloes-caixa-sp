name: Atualizar mapa de leilões

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-mapa
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Pegar o código e o banco
        uses: actions/checkout@v6

      - name: Preparar o Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar as bibliotecas
        run: pip install --quiet pandas curl_cffi shapely

      - name: Baixar a lista nova da Caixa
        run: python baixar_caixa.py

      - name: Descobrir onde ficam os imóveis
        env:
          GEOCODER: ${{ secrets.HERE_API_KEY != '' && 'here' || 'osm' }}
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
          CACHE_DIAS: "30"
        run: python geocodificar.py --uf SP

      - name: Montar o mapa
        run: |
          python gerar_mapa.py
          mkdir -p site
          cp mapa_sp.html site/index.html

      - name: Guardar o banco atualizado
        run: |
          git config user.name "robo-leiloes"
          git config user.email "actions@github.com"
          git add -A imoveis_caixa.db site/ dados_brutos/ || true
          git diff --staged --quiet || git commit -m "Atualização automática: $(date -u +%d/%m/%Y)"
          git push

      - name: Publicar o site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
